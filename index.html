<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holy Pocket · Control de gastos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--navrgb:255,255,255;--na:.55;--nb:26px;--g1:#ECEEFF;--tb:#C9D0E6;--tbg:#EEF1FA;color-scheme:light;--bg:#F6F7FD;--card:#fff;--ink:#101828;--mut:#667085;--line:#E4E7EC;--in:#0E9F8E;--out:#E11D48;--acc:#5B4BDB;--accink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0E1220;--card:#181D30;--ink:#EEF1F8;--mut:#98A2B8;--line:#2A3150;--in:#2DD4BF;--out:#FB7185;--acc:#8B7CF6;--g1:#171C38;--tb:#3A4268;--tbg:#1F2540;--navrgb:24,29,48}
:root[data-theme="dark"] nav{border-color:rgba(255,255,255,.12)}
*{box-sizing:border-box}
html,body{overflow-x:clip;max-width:100%;margin:0;background:linear-gradient(var(--g1),var(--bg) 320px) no-repeat var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.011em}
body{display:flex;justify-content:center}
#app{overflow-x:clip;width:100%;max-width:440px;min-height:100vh;padding:18px 18px 130px;position:relative}
h1{font-size:15px;font-weight:700;margin:0;color:var(--mut)}
.top{display:flex;justify-content:space-between;align-items:center}
.hero{margin:14px 0 18px}
.hero small{color:var(--mut);font-size:14px}
.big{white-space:nowrap;font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1.1;margin:2px 0 10px}
.pair{display:flex;gap:10px}
.pair div{min-width:0;flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--mut)}
.pair b{white-space:nowrap;display:block;font-size:17px;color:var(--ink);margin-top:2px}
.in b{color:var(--in)}.out b{color:var(--out)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 12px;font-weight:700;letter-spacing:-.02em}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .4s}
.bar.over i{background:var(--out)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--bg)}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t span{font-size:12px;color:var(--mut)}
.amt{white-space:nowrap;font-weight:600;font-size:15px}
.row .amt{max-width:55%;text-align:right}
.row .t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.amt.o{color:var(--out)}.amt.i{color:var(--in)}
.del{border:0;background:none;color:var(--mut);font-size:18px;cursor:pointer;padding:6px}
.donut{display:flex;align-items:center;gap:18px}
.ring{width:120px;height:120px;border-radius:50%;flex:none;position:relative}
.ring::after{content:"";position:absolute;inset:26px;background:var(--card);border-radius:50%}
.leg{flex:1;min-width:0;font-size:13px}
.leg .kp{display:block;padding:0 0 10px}.kp small{display:block;color:var(--mut);font-size:12px;margin-bottom:2px}.kp b{display:block;font-size:20px;font-weight:700;white-space:nowrap}.leg div{display:flex;justify-content:space-between;padding:3px 0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.empty{color:var(--mut);font-size:14px;padding:6px 0}
.acs h2{margin-bottom:2px}.acc{border-top:1px solid var(--line)}.acc:first-of-type{border-top:0}
.acc summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 2px;font-weight:600;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"›";margin-left:auto;color:var(--mut);font-size:22px;transition:transform .25s}
.acc[open] summary::after{transform:rotate(90deg)}
.accb{padding:0 2px 14px;animation:fade .25s}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600}
.gg{font-weight:800;font-size:18px;background:conic-gradient(from -45deg,#EA4335 0 25%,#FBBC05 0 50%,#34A853 0 75%,#4285F4 0);-webkit-background-clip:text;background-clip:text;color:transparent}
*{-webkit-tap-highlight-color:transparent}
svg{flex:none;display:block}
nav button{outline:none;-webkit-user-select:none;user-select:none}
nav button:focus-visible{outline:2px solid var(--acc);outline-offset:-4px}
.av svg,.avb svg{color:#fff}.avb{color:#fff}
.accb h4{margin:14px 0 8px;font-size:13px;font-weight:600;color:var(--mut)}.accb h4:first-child{margin-top:0}
.acc summary span{display:flex;color:var(--acc)}
.lv{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:600}
.lv.on{background:var(--acc);border-color:var(--acc);color:#fff}
.mrow{display:flex;justify-content:space-between;align-items:center}.mnav{display:flex;gap:6px}
.mnav button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;line-height:1;cursor:pointer}
.rep{display:flex;align-items:center;gap:8px;font-size:14px;margin:0 0 14px;color:var(--mut)}
.bar.over i{background:repeating-linear-gradient(45deg,var(--out) 0 8px,rgba(255,255,255,.4) 8px 16px)}
#lock{display:none;position:fixed;inset:0;z-index:90;background:linear-gradient(160deg,var(--g1),var(--bg));align-items:center;justify-content:center;padding:24px}
#lock.on{display:flex}.lbox{width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px;text-align:center}
.lbox b{font-size:24px;font-weight:800}.lbox span{color:var(--mut);font-size:14px}
.lbox input{text-align:center;font:inherit;font-size:28px;letter-spacing:.5em;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
.pbtn{display:flex;gap:8px;margin-bottom:12px}.pbtn .ghost{flex:1;width:auto;display:flex;align-items:center;justify-content:center;gap:8px}
.avg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:12px 6px 6px}
.avb{aspect-ratio:1;border:0;padding:0;border-radius:50%;font-size:28px;line-height:1;cursor:pointer;display:grid;place-items:center;overflow:hidden}
.avb.on{box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--acc)}
.hrs{font-size:13px;color:var(--acc);min-height:20px;margin-bottom:6px;font-weight:600}
.pace p{margin:0 0 8px;font-size:14px}.pace .mut{color:var(--mut);font-size:13px;margin:0}
.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--in);margin-right:8px;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(14,159,142,.5)}100%{box-shadow:0 0 0 10px rgba(14,159,142,0)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes grow{from{width:0}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes pop{from{transform:scale(.7)}}
@keyframes fillup{to{height:78%}}
#app.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
#app.enter>*:nth-child(2){animation-delay:.05s}#app.enter>*:nth-child(3){animation-delay:.1s}#app.enter>*:nth-child(4){animation-delay:.15s}#app.enter>*:nth-child(5){animation-delay:.2s}#app.enter>*:nth-child(n+6){animation-delay:.25s}
.bar i{animation:grow .9s cubic-bezier(.2,.8,.2,1)}
button{transition:transform .15s,background .2s,color .2s,border-color .2s}
button:active{transform:scale(.95)}
nav .tab.on span{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.sheet.open{animation:fade .25s both}
.sheet.open form{animation:up .38s cubic-bezier(.2,.8,.2,1) both}
#splash{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,var(--g1),var(--bg));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s,visibility .5s}
#splash.out{opacity:0;visibility:hidden}
.slogo{width:64px;height:92px;border:3px solid var(--acc);border-radius:32px/12px;position:relative;overflow:hidden;background:var(--card)}
.slogo i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(var(--in),var(--acc));animation:fillup 1.3s .15s cubic-bezier(.3,.7,.2,1) forwards}
.slogo i::before{content:"";position:absolute;left:-30%;width:160%;top:-7px;height:14px;border-radius:50%;background:inherit;animation:slosh 1.2s ease-in-out infinite alternate}
#splash b{font-size:26px;font-weight:800;letter-spacing:-.5px;animation:rise .6s .3s both}
#splash span{font-size:13px;color:var(--mut);animation:rise .6s .5s both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13px;padding:6px 11px;border-radius:16px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.tubewrap{display:flex;align-items:center;gap:18px}
.tube{isolation:isolate;width:124px;height:240px;flex:none;position:relative;overflow:hidden;border:2px solid var(--tb);border-radius:62px/18px;background:repeating-linear-gradient(to top,transparent 0 calc(25% - 1px),rgba(140,150,200,.3) calc(25% - 1px) 25%),var(--tbg)}
.tube::before{content:"";position:absolute;left:0;right:0;top:0;height:34px;border-radius:50%;background:rgba(255,255,255,.35);border-bottom:2px solid rgba(255,255,255,.8);z-index:51;pointer-events:none}
.tube::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:50;background:linear-gradient(90deg,rgba(255,255,255,.65),rgba(255,255,255,0) 30%,rgba(255,255,255,0) 70%,rgba(60,70,120,.12))}
.liq{position:absolute;left:0;right:0;bottom:0;height:0;display:flex;flex-direction:column-reverse;transition:height 1.5s cubic-bezier(.2,.8,.2,1)}
.sg::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.3),rgba(255,255,255,0) 40%,rgba(0,0,0,.14))}
.cylw{display:flex;flex:none}
.scale{position:relative;width:36px;height:240px;margin-left:6px;font-size:10px;color:var(--mut)}
.scale span{position:absolute;left:0}
.sg{position:relative;height:0;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.4);white-space:pre;text-align:center;line-height:1.2;transition:height 1.5s cubic-bezier(.2,.8,.2,1)}
.sg::before{content:"";position:absolute;left:-30%;width:160%;top:-8px;height:16px;background:inherit;border-radius:50%;animation:slosh 3.2s ease-in-out infinite alternate}
@keyframes slosh{from{transform:translateX(-14%) scaleY(1)}to{transform:translateX(14%) scaleY(.5)}}
.av{width:64px;height:64px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800;flex:none}
.rk{display:flex;gap:14px;align-items:center}
.lad div{display:flex;gap:10px;padding:6px 0;font-size:14px;color:var(--mut)}
.lad .ok{color:var(--ink);font-weight:600}
@media (prefers-reduced-motion:reduce){.sg::before{animation:none}}
nav{z-index:5;position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:412px;background:rgba(var(--navrgb),var(--na));-webkit-backdrop-filter:blur(var(--nb)) saturate(190%);backdrop-filter:blur(var(--nb)) saturate(190%);border:1px solid rgba(255,255,255,.55);box-shadow:0 10px 30px rgba(20,30,70,.18),inset 0 1px 0 rgba(255,255,255,.6);border-radius:34px;overflow:hidden;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:7px 8px}
.ind{position:absolute;left:8px;top:7px;bottom:7px;width:calc((100% - 16px)/5);transform:translateX(calc(var(--i,0)*100%));transition:transform .5s cubic-bezier(.3,1.3,.5,1);z-index:0;pointer-events:none}
.ind::before{content:"";position:absolute;inset:0 3px;border-radius:24px;background:rgba(91,75,219,.16);background:color-mix(in srgb,var(--acc) 16%,transparent);box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
nav button.tab{position:relative;z-index:1;border:0;background:none;color:var(--mut);font:inherit;font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:8px 2px;border-radius:24px;min-width:0;align-self:stretch;justify-content:center}
nav button.tab.on{color:var(--acc);font-weight:600}
nav .tab span{display:flex;height:22px;align-items:center}
.add{justify-self:center;position:relative;z-index:1;width:52px;height:52px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--acc),#8B5CF6);color:#fff;font-size:30px;line-height:1;cursor:pointer;box-shadow:0 6px 16px rgba(91,75,219,.4),inset 0 1px 0 rgba(255,255,255,.4)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.sheet{position:fixed;inset:0;background:rgba(10,14,28,.5);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.open{display:flex}
.sheet form{background:var(--card);width:100%;max-width:440px;border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;font:inherit;padding:9px;border-radius:9px;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.amtin{width:100%;border:0;background:none;font:inherit;font-size:38px;font-weight:800;color:var(--ink);padding:4px 0;letter-spacing:-1px}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.cats button{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13px;padding:8px 12px;border-radius:20px;cursor:pointer}
.cats button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.f{display:flex;gap:10px;margin-bottom:14px}
.f input{flex:1;min-width:0;font:inherit;font-size:15px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.save{width:100%;border:0;background:var(--acc);color:var(--accink);font:inherit;font-weight:600;font-size:16px;padding:14px;border-radius:14px;cursor:pointer}
.ghost{border:1px solid var(--line);background:none;color:var(--ink);font:inherit;padding:10px 14px;border-radius:12px;cursor:pointer;width:100%}
label.lb{font-size:13px;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:200}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="splash"><div class="slogo"><i></i></div><b>Holy Pocket</b><span>Tu dinero, claro y en movimiento</span></div>
<div id="lock"><div class="lbox"><b>Holy Pocket</b><span>Ingresa tu PIN</span><input id="lpin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="PIN"><button class="save" id="lgo">Desbloquear</button><button class="ghost" id="lforgot">Olvidé mi PIN</button></div></div>
<div id="app"></div>
<input type="file" id="fcam" accept="image/*" capture="user" hidden><input type="file" id="fgal" accept="image/*" hidden>
<nav><i class="ind"></i>
  <button class="tab on" data-v="home" data-i="0"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>Inicio</button>
  <button class="tab" data-v="list" data-i="1"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>Historial</button>
  <button class="add" id="addBtn" aria-label="Agregar movimiento">+</button>
  <button class="tab" data-v="sum" data-i="3"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span>Resumen</button>
  <button class="tab" data-v="prof" data-i="4"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>Perfil</button>
</nav>
<div class="sheet" id="sheet">
  <form id="form">
    <div class="seg"><button type="button" data-t="out" class="on">Gasto</button><button type="button" data-t="in">Ingreso</button></div>
    <input class="amtin" id="amount" inputmode="numeric" placeholder="$ 0" autocomplete="off" aria-label="Monto">
    <div class="hrs" id="hrs"></div>
    <label class="lb">Categoría</label>
    <div class="cats" id="cats"></div>
    <div class="f"><input id="note" placeholder="Nota (opcional)" maxlength="40"><input id="date" type="date"></div>
    <label class="rep" id="repw"><input type="checkbox" id="rep">Repetir cada mes</label>
    <button class="save" type="submit">Guardar gasto</button>
    <button class="ghost" type="button" id="cancel" style="margin-top:8px">Cancelar</button>
  </form>
</div>
<div class="toast" id="toast"></div>
